services:
  # ─── Kafka (KRaft mode, no Zookeeper) ────────────────────────────────────────
  kafka:
    image: apache/kafka:3.7.0          # official Apache image, always available
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 48
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"   # required for KRaft; any valid base64 UUID
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2   # pinned stable tag instead of :latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Cassandra ───────────────────────────────────────────────────────────────
  cassandra:
    image: cassandra:4.1
    container_name: cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: TrendingCluster
      CASSANDRA_NUM_TOKENS: 16            # faster startup on single node
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' > /dev/null 2>&1"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 60s                  # cassandra is slow to boot; give it time

  cassandra-init:
    image: cassandra:4.1
    container_name: cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./cassandra/schema.cql:/schema.cql
    command: /bin/bash -c "cqlsh cassandra -f /schema.cql && echo 'Schema applied OK'"
    restart: "no"

  # ─── Apache Flink ────────────────────────────────────────────────────────────
  jobmanager:
    build: ./flink_jobs
    container_name: jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        parallelism.default: 2
    volumes:
      - ./flink_jobs:/opt/flink/usrlib
      - ./config:/opt/flink/config
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview > /dev/null"]
      interval: 20s
      timeout: 10s
      retries: 5

  taskmanager:
    build: ./flink_jobs
    container_name: taskmanager
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2
    volumes:
      - ./flink_jobs:/opt/flink/usrlib
      - ./config:/opt/flink/config

  # ─── Grafana ─────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: redis-datasource
      GF_PLUGINS_ALLOW_UNSIGNED: redis-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning.yaml:/etc/grafana/provisioning/dashboards/provider.yaml
      - ./grafana/datasource.yaml:/etc/grafana/provisioning/datasources/redis.yaml
      - ./grafana/dashboard.json:/etc/grafana/provisioning/dashboards/trending_engine.json
    depends_on:
      - redis

  flink-job-submit:
    build: ./flink_jobs
    container_name: flink-job-submit
    volumes:
      - ./config:/opt/flink/config
      - ./flink_jobs:/opt/flink/usrlib
    depends_on:
      jobmanager:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: >
      bash -c "sleep 15 && flink run -d -m jobmanager:8081 -py /opt/flink/usrlib/sliding_window_agg.py"
    restart: on-failure

  api:
    build: ./api
    container_name: trending-api
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      cassandra:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      CASSANDRA_HOST: cassandra
    restart: always

  # ─── Bluesky Producer ────────────────────────────────────────────────────────
  producer:
    build: ./producer
    container_name: bluesky-producer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: raw-posts
    restart: on-failure:5

  volume-monitor:
    build: ./producer
    container_name: volume-monitor
    depends_on:
      - kafka
    volumes:
      - kafka_data:/var/lib/kafka/data:ro
    command: ["python", "volume_monitor.py"]
    restart: always

volumes:
  kafka_data:
  redis_data:
  cassandra_data:
  grafana_data: